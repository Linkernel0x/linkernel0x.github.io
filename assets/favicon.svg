<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <!-- Maschera per angoli arrotondati perfetti -->
        <clipPath id="rc">
            <rect width="64" height="64" rx="18" />
        </clipPath>

        <!-- Gradiente Arcobaleno Vibrante -->
        <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF3E3E"/>
            <stop offset="25%" stop-color="#FFBE3D"/>
            <stop offset="50%" stop-color="#44EC8C"/>
            <stop offset="75%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#A855F7"/>
        </linearGradient>

        <!-- Luce ambientale sullo sfondo -->
        <radialGradient id="bgLight" cx="50%" cy="40%" r="70%">
            <stop offset="0%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#020617"/>
        </radialGradient>

        <!-- Gradiente colline con riflesso superiore -->
        <linearGradient id="hillFront" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.1"/> <!-- Luce di riflesso -->
            <stop offset="5%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
    </defs>

    <!-- Corpo Icona -->
    <g clip-path="url(#rc)">
        <!-- Sfondo con profondità -->
        <rect width="64" height="64" fill="url(#bgLight)" />

        <!-- Piccole stelle stilizzate -->
        <circle cx="12" cy="15" r="0.6" fill="white" opacity="0.4" />
        <circle cx="52" cy="10" r="0.8" fill="white" opacity="0.6" />
        <circle cx="48" cy="28" r="0.5" fill="white" opacity="0.3" />

        <!-- Bagliore diffuso del sole (Glow morbido) -->
        <circle cx="32" cy="24" r="22" fill="url(#sunGrad)" opacity="0.12" />

        <!-- Sole Arcobaleno -->
        <circle cx="32" cy="24" r="13" fill="url(#sunGrad)" />
        <!-- Riflesso "vetroso" sul sole -->
        <circle cx="28" cy="20" r="4" fill="white" opacity="0.2" />

        <!-- Collina Posteriore -->
        <path d="M-5 64 L-5 42 C10 38 25 48 40 38 C55 30 70 35 70 35 L70 64 Z" fill="#111827" />

        <!-- Collina Anteriore con luce di profilo (Rim Light) -->
        <path d="M-5 64 L-5 50 C15 40 40 60 70 45 L70 64 Z" fill="url(#hillFront)" />

        <!-- Linea di luce sottile sulla cresta della collina -->
        <path d="M-5 50 C15 40 40 60 70 45" fill="none" stroke="white" stroke-width="0.4" opacity="0.2" />

        <!-- Overlay per effetto finitura Apple (Vetro superiore) -->
        <rect width="64" height="64" fill="white" opacity="0.03" />
    </g>

    <!-- Bordo di rifinitura esterno (Border) -->
    <rect width="63" height="63" x="0.5" y="0.5" rx="17.5" fill="none" stroke="white" stroke-width="0.5" opacity="0.1" />
</svg>
